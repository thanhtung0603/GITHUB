<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>THÔNG TIN</h1>
    <form action="submit_form.html" method="post" target="_blank" style="background-color: rgb(240, 171, 203);">
        <label for="ht">Họ và tên</label><br>
        <input type="text" name="ht" id="ht" placeholder="Nhập họ và tên của bạn" size="86" ><br>
        <label for="">Email</label><br>
        <input type="email" name="email" id="email" placeholder="Nhập email của bạn" size="86" required><br>
        <label for="mk">Mật khẩu</label><br>
        <input type="password" name="mk" id="mk" placeholder="Nhập mật khẩu của bạn" size="86" minlength="8"><br>
        <label for="date">Ngày sinh</label><br>
        <input type="date" name="date" id="date" placeholder="Nhập ngày sinh của bạn" size="86">
        <h1>Thanh Tùng</h1>
        <p>Chọn giới tính của bạn</p>
        <input type="radio" id="nam" name="Giới tính" value="Nam">
        <label for="nam">Nam</label><br>
        <input type="radio" id="nữ" name="Giới tính" value="Nữ">
        <label for="nữ">Nữ</label>
        <p>Sở thích</p>
        <input type="checkbox" name="" id="" value="Đánh cầu">
        <label for="">Đánh cầu</label><br>
        <input type="checkbox" name="" id="" value="Hát">
        <label for="">Hát</label><br>
        <input type="checkbox" name="" id="" value="Nghe nhạc">
        <label for="">Nghe nhạc</label><br>
        <br><label for="">Ảnh đại diện</label><br>
        <input type="file" name="" id="" accept="image/*"><br>
        <br><input type="button" name="" id="" value="Gửi" style="background-color: rgb(116, 236, 240); width: 60px; height: 30px;">
    </form>
</body>
</html>
